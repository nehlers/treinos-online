<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121317">
<title>Diário de Treino</title>
<style>
  :root{
    --bg:#121317;
    --surface:#1a1c22;
    --surface-2:#22252c;
    --surface-3:#2a2e37;
    --border:#31353f;
    --text:#eef0f2;
    --text-dim:#9aa1ad;
    --text-faint:#666c78;
    --accent:#c8ff4d;
    --accent-ink:#1a2200;
    --warn:#ff6b4a;
    --warn-ink:#2a0a02;
    --blue:#5fb8ff;
    --pink:#ff8fc7;
    --radius:14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(74px + var(--safe-b));
    min-height:100vh;
  }
  h1,h2,h3{margin:0; letter-spacing:.02em;}
  .eyebrow{
    font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); margin:0 0 4px;
  }
  .display{
    font-weight:800; text-transform:uppercase; letter-spacing:.01em;
  }
  header.topbar{
    position:sticky; top:0; z-index:20;
    padding:calc(16px + var(--safe-t)) 18px 14px;
    background:linear-gradient(180deg, var(--bg) 70%, rgba(18,19,23,0));
    display:flex; align-items:center; justify-content:space-between;
  }
  header.topbar .title{font-size:20px;}
  header.topbar .sub{font-size:12px; color:var(--text-dim); margin-top:2px; font-weight:500;}
  main{padding:0 16px 24px;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; margin-bottom:12px;
  }
  .card.tight{padding:12px 14px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:11px; padding:13px 18px; font-size:15px; font-weight:700;
    cursor:pointer; background:var(--surface-3); color:var(--text); width:100%;
    letter-spacing:.01em;
  }
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--accent); color:var(--accent-ink);}
  .btn.warn{background:var(--warn); color:var(--warn-ink);}
  .btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text-dim);}
  .btn.sm{padding:8px 12px; font-size:13px; width:auto;}
  .row{display:flex; gap:10px;}
  .row.wrap{flex-wrap:wrap;}
  .col{flex:1;}
  label{font-size:12px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:6px;}
  input[type=text], input[type=number], input[type=date], select{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:11px 12px; font-size:16px; font-family:inherit;
  }
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:-1px;}
  .field{margin-bottom:12px;}
  .pill{
    display:inline-flex; align-items:center; padding:4px 10px; border-radius:99px; font-size:11px;
    font-weight:800; letter-spacing:.04em; text-transform:uppercase; background:var(--surface-3); color:var(--text-dim);
  }
  .pill.on{background:var(--accent); color:var(--accent-ink);}
  .notice{
    border-left:3px solid var(--accent); background:var(--surface-2); padding:9px 12px; border-radius:0 8px 8px 0;
    font-size:13px; color:var(--text-dim); margin-bottom:8px; line-height:1.4;
  }
  .notice.warn{border-left-color:var(--warn);}
  .empty{
    text-align:center; padding:50px 20px; color:var(--text-dim);
  }
  .empty .big{font-size:38px; margin-bottom:10px;}
  /* Tabs / bottom nav */
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:rgba(26,28,34,.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    display:flex; padding:8px 6px calc(8px + var(--safe-b));
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-faint); font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px;
    font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; cursor:pointer;
  }
  nav.tabbar button .ic{font-size:20px; line-height:1;}
  nav.tabbar button.active{color:var(--accent);}
  .tabpage{display:none;}
  .tabpage.active{display:block;}

  /* workout picker chips */
  .chiprow{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; -webkit-overflow-scrolling:touch;}
  .chip{
    flex:0 0 auto; background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:12px 16px; border-radius:12px; font-weight:800; font-size:14px; cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  .section-head{
    display:flex; align-items:baseline; justify-content:space-between; margin:22px 0 10px;
  }
  .section-head h3{font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-dim); font-weight:800;}

  .exercise{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px;
  }
  .exercise .exname{font-size:15.5px; font-weight:700; margin-bottom:2px;}
  .exercise .exdica{font-size:12.5px; color:var(--text-dim); margin-bottom:12px; line-height:1.4;}
  .exercise .exlast{font-size:11.5px; color:var(--accent); margin-bottom:10px; font-weight:700;}
  .setrow{
    display:grid; grid-template-columns:34px 1fr 1fr 46px; gap:8px; align-items:center; margin-bottom:8px;
  }
  .setrow .setnum{
    width:28px; height:28px; border-radius:50%; background:var(--surface-3); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;
  }
  .setrow input{padding:9px 8px; font-size:15px; text-align:center;}
  .checkbtn{
    width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; color:var(--text-faint);
  }
  .checkbtn.done{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .durationrow{
    display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface-2);
    border-radius:10px; padding:10px 12px;
  }
  .durationrow .dtext{font-size:13.5px; color:var(--text-dim);}

  /* Rest timer overlay */
  #restOverlay{
    position:fixed; inset:0; z-index:60; background:rgba(10,11,14,.88); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; flex-direction:column; padding:24px;
  }
  #restOverlay.show{display:flex;}
  .timerwrap{position:relative; width:220px; height:220px; margin-bottom:22px;}
  .timerwrap svg{width:100%; height:100%; transform:rotate(-90deg);}
  .timerwrap .num{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:52px; font-weight:800; font-variant-numeric:tabular-nums;
  }
  .resttitle{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim); font-weight:800; margin-bottom:6px;}
  .restactions{display:flex; gap:10px; width:100%; max-width:320px;}

  /* history */
  .logitem{border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; background:var(--surface);}
  .logitem summary{
    list-style:none; cursor:pointer; padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
  }
  .logitem summary::-webkit-details-marker{display:none;}
  .logitem .lidate{font-weight:800; font-size:14.5px;}
  .logitem .liwk{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .logitem .liarrow{color:var(--text-faint); transition:transform .15s;}
  .logitem[open] .liarrow{transform:rotate(90deg);}
  .logitem .lbody{padding:0 16px 14px; border-top:1px solid var(--border); padding-top:10px;}
  .lex{margin-bottom:8px;}
  .lex .lname{font-size:13.5px; font-weight:700; margin-bottom:3px;}
  .lsets{display:flex; gap:6px; flex-wrap:wrap;}
  .lsets span{background:var(--surface-2); padding:4px 8px; border-radius:7px; font-size:12px; color:var(--text-dim);}
  .lsets span.done{color:var(--accent);}

  /* measurements */
  .mrow{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);}
  .mrow:last-child{border-bottom:none;}
  .mrow .mdate{font-size:13px; font-weight:700;}
  .mrow .mvals{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .delta{font-size:11.5px; font-weight:800; padding:2px 7px; border-radius:6px;}
  .delta.down{color:#a6ff7a; background:rgba(166,255,122,.1);}
  .delta.up{color:var(--warn); background:rgba(255,107,74,.1);}
  .delta.same{color:var(--text-faint); background:var(--surface-2);}
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .statcard{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px;}
  .statcard .slabel{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; font-weight:800;}
  .statcard .sval{font-size:22px; font-weight:800; margin-top:4px;}
  .statcard canvas{width:100%; height:44px; margin-top:8px; display:block;}
  .iconbtn{background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); border-radius:9px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer;}

  .planitem{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--border); gap:10px;}
  .planitem:last-child{border-bottom:none;}
  .planitem .pname{font-size:13.5px; font-weight:700;}
  .planitem .pmeta{font-size:11.5px; color:var(--text-dim); margin-top:2px;}

  input[type=file]{display:none;}
  .hint{font-size:11.5px; color:var(--text-faint); margin-top:6px; line-height:1.4;}
  ::selection{background:var(--accent); color:var(--accent-ink);}
</style>
</head>
<body>

<header class="topbar">
  <div>
    <div class="eyebrow" id="hdrEyebrow">Hoje</div>
    <div class="display title" id="hdrTitle">Diário de Treino</div>
  </div>
  <div class="pill" id="hdrPill">—</div>
</header>

<main>
  <!-- TREINO -->
  <section class="tabpage active" id="page-treino"></section>
  <!-- HISTÓRICO -->
  <section class="tabpage" id="page-historico"></section>
  <!-- MEDIDAS -->
  <section class="tabpage" id="page-medidas"></section>
  <!-- CONFIG -->
  <section class="tabpage" id="page-config"></section>
</main>

<nav class="tabbar">
  <button data-tab="treino" class="active"><span class="ic">🏋️</span>Treino</button>
  <button data-tab="historico"><span class="ic">📜</span>Histórico</button>
  <button data-tab="medidas"><span class="ic">📏</span>Medidas</button>
  <button data-tab="config"><span class="ic">⚙️</span>Ajustes</button>
</nav>

<input type="file" id="fileInput" accept=".md,text/markdown,text/plain">

<div id="restOverlay">
  <div class="resttitle">Descanso</div>
  <div class="timerwrap">
    <svg viewBox="0 0 220 220">
      <circle cx="110" cy="110" r="98" fill="none" stroke="#2a2e37" stroke-width="14"/>
      <circle id="restRing" cx="110" cy="110" r="98" fill="none" stroke="#c8ff4d" stroke-width="14" stroke-linecap="round"/>
    </svg>
    <div class="num" id="restNum">60</div>
  </div>
  <div class="restactions">
    <button class="btn ghost" id="restAdd">+15s</button>
    <button class="btn primary" id="restSkip">Pular</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------
   STORAGE
--------------------------------------------------------- */
const STORE_KEY = "diarioTreino_v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { plans:[], activePlanId:null, logs:[], measurements:[], settings:{ restSeconds:60, customFields:[] } };
}
function saveState(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}
let state = loadState();
if(!state.settings) state.settings = { restSeconds:60, customFields:[] };
if(state.settings.restSeconds == null) state.settings.restSeconds = 60;
if(!state.settings.customFields) state.settings.customFields = [];
if(!state.logs) state.logs = [];
if(!state.measurements) state.measurements = [];
if(!state.plans) state.plans = [];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ const d = new Date(); return d.toISOString().slice(0,10); }
function fmtDateBR(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

/* ---------------------------------------------------------
   MARKDOWN PARSER
--------------------------------------------------------- */
function parseWorkoutMarkdown(text){
  const lines = text.split('\n');
  const plan = { title:'', meta:'', notes:[], workouts:[] };
  let i = 0, currentWorkout = null, currentSection = null, tableHeader = null, inTopMatter = true;

  while(i < lines.length){
    const trimmed = lines[i].trim();

    if(/^##\s*😴/.test(trimmed) || /^##\s*Descanso/i.test(trimmed)) break;

    if(trimmed.startsWith('# ')){
      plan.title = trimmed.replace(/^#\s*/, '').trim();
      inTopMatter = true; i++; continue;
    }
    if(trimmed.startsWith('## ')){
      currentWorkout = { title: trimmed.replace(/^##\s*/, '').trim(), notes:[], sections:[] };
      plan.workouts.push(currentWorkout);
      currentSection = null; tableHeader = null; inTopMatter = false;
      i++; continue;
    }
    if(trimmed.startsWith('### ')){
      currentSection = { name: trimmed.replace(/^###\s*/, '').trim(), columnType:null, exercises:[] };
      if(currentWorkout) currentWorkout.sections.push(currentSection);
      tableHeader = null; i++; continue;
    }
    if(trimmed.startsWith('**') && inTopMatter){
      plan.meta = trimmed.replace(/\*\*/g, '').trim();
      i++; continue;
    }
    if(trimmed.startsWith('>')){
      const note = trimmed.replace(/^>\s*/, '').trim();
      if(currentWorkout && !inTopMatter) currentWorkout.notes.push(note);
      else if(inTopMatter) plan.notes.push(note);
      i++; continue;
    }
    if(trimmed.startsWith('|')){
      const cleaned = trimmed.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      if(cleaned.every(c => /^:?-+:?$/.test(c))){ i++; continue; }
      if(!tableHeader){
        tableHeader = cleaned;
        if(!currentSection && currentWorkout){
          currentSection = { name:'Treino Principal', columnType:null, exercises:[] };
          currentWorkout.sections.push(currentSection);
        }
        if(currentSection) currentSection.columnType = tableHeader[1];
        i++; continue;
      } else {
        const [name, seriesOrDuration, dica] = cleaned;
        if(currentSection && name){
          const parsed = parseSeriesOrDuration(seriesOrDuration, currentSection.columnType);
          currentSection.exercises.push({ name, raw:seriesOrDuration, dica: dica||'', ...parsed });
        }
        i++; continue;
      }
    }
    i++;
  }
  return plan;
}
function parseSeriesOrDuration(str, columnType){
  if(!str) return { numSets:1, repLabel:'', isDuration: columnType === 'Duração' };
  if(columnType === 'Duração') return { numSets:1, repLabel:str.trim(), isDuration:true };
  const match = str.match(/^(\d+)\s*[x×X]\s*(.+)$/);
  if(match) return { numSets: parseInt(match[1],10), repLabel: match[2].trim(), isDuration:false };
  if(/^\d+\s*min(utos)?$/i.test(str.trim())) return { numSets:1, repLabel:str.trim(), isDuration:true };
  return { numSets:1, repLabel:str.trim(), isDuration:false };
}

/* ---------------------------------------------------------
   PLAN MANAGEMENT
--------------------------------------------------------- */
function getActivePlan(){
  return state.plans.find(p => p.id === state.activePlanId) || null;
}
function handleFile(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = parseWorkoutMarkdown(e.target.result);
      if(!parsed.workouts.length){
        alert('Não consegui encontrar treinos nesse arquivo. Confira o formato do .md e tente novamente.');
        return;
      }
      const doSwitch = () => {
        const plan = { id: uid(), ...parsed, uploadedAt: new Date().toISOString() };
        state.plans.push(plan);
        state.activePlanId = plan.id;
        state.selectedWorkoutTitle = null;
        saveState();
        setTab('treino');
        render();
      };
      const active = getActivePlan();
      if(active){
        if(confirm(`Isso vai substituir o treino ativo ("${active.title.replace(/[🏋️#]/g,'').trim()}") por este novo arquivo. O treino antigo fica salvo no histórico. Continuar?`)){
          doSwitch();
        }
      } else {
        doSwitch();
      }
    }catch(err){
      alert('Não consegui ler esse arquivo. Verifique se é um .md válido.');
    }
  };
  reader.readAsText(file, 'utf-8');
}
document.getElementById('fileInput').addEventListener('change', function(e){
  if(e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
  e.target.value = '';
});

/* ---------------------------------------------------------
   LOGS (peso por série)
--------------------------------------------------------- */
function findLog(date, planId, workoutTitle){
  return state.logs.find(l => l.date === date && l.planId === planId && l.workoutTitle === workoutTitle);
}
function buildLogSkeleton(date, plan, workout){
  return { id: uid(), date, planId: plan.id, planTitle: plan.title, workoutTitle: workout.title, exercises: {} };
}
function fillLogDefaults(log, workout){
  workout.sections.forEach(section => {
    section.exercises.forEach(ex => {
      if(!log.exercises[ex.name]){
        log.exercises[ex.name] = ex.isDuration
          ? { completedDuration:false }
          : { sets: Array.from({length: ex.numSets}, (_,idx) => ({
              weight: getLastValueForExercise(ex.name, idx), reps: ex.repLabel, completed:false
            })) };
      } else if(!ex.isDuration){
        const entry = log.exercises[ex.name];
        while(entry.sets.length < ex.numSets) entry.sets.push({ weight:'', reps: ex.repLabel, completed:false });
      }
    });
  });
  return log;
}
// usada só para exibir (não grava nada até o usuário interagir de fato)
function getDisplayLog(date, plan, workout){
  const existing = findLog(date, plan.id, workout.title);
  const log = existing || buildLogSkeleton(date, plan, workout);
  return fillLogDefaults(log, workout);
}
// usada quando o usuário realmente edita algo — só aí a sessão é gravada no histórico
function getPersistedLog(date, plan, workout){
  let log = findLog(date, plan.id, workout.title);
  if(!log){
    log = fillLogDefaults(buildLogSkeleton(date, plan, workout), workout);
    state.logs.push(log);
  }
  return log;
}
function getLastValueForExercise(exerciseName, setIndex){
  // procura o log mais recente (qualquer plano) que tenha essa série preenchida
  const sorted = [...state.logs].sort((a,b) => b.date.localeCompare(a.date));
  for(const l of sorted){
    const ex = l.exercises[exerciseName];
    if(ex && ex.sets && ex.sets[setIndex] && ex.sets[setIndex].weight){
      return ex.sets[setIndex].weight;
    }
  }
  return '';
}
function getLastSessionInfo(exerciseName, excludeDate){
  const sorted = [...state.logs].filter(l => l.date !== excludeDate).sort((a,b) => b.date.localeCompare(a.date));
  for(const l of sorted){
    const ex = l.exercises[exerciseName];
    if(ex && ex.sets && ex.sets.some(s => s.weight)){
      const weights = ex.sets.map(s => s.weight || '-').join(' / ');
      return `Última vez (${fmtDateBR(l.date)}): ${weights} kg`;
    }
  }
  return null;
}

/* ---------------------------------------------------------
   REST TIMER
--------------------------------------------------------- */
let restTimer = { running:false, remaining:0, total:0, intervalId:null };
const restOverlay = document.getElementById('restOverlay');
const restNum = document.getElementById('restNum');
const restRing = document.getElementById('restRing');
const RING_CIRC = 2 * Math.PI * 98;
restRing.style.strokeDasharray = RING_CIRC;

function startRestTimer(){
  clearInterval(restTimer.intervalId);
  const secs = Math.max(5, parseInt(state.settings.restSeconds,10) || 60);
  restTimer.total = secs;
  restTimer.remaining = secs;
  restTimer.running = true;
  restOverlay.classList.add('show');
  updateRestUI();
  restTimer.intervalId = setInterval(() => {
    restTimer.remaining--;
    if(restTimer.remaining <= 0){
      updateRestUI();
      finishRestTimer();
    } else {
      updateRestUI();
    }
  }, 1000);
}
function updateRestUI(){
  restNum.textContent = Math.max(0, restTimer.remaining);
  const frac = restTimer.remaining / restTimer.total;
  restRing.style.strokeDashoffset = RING_CIRC * (1 - Math.max(0,frac));
  restRing.style.stroke = restTimer.remaining <= 5 ? '#ff6b4a' : '#c8ff4d';
}
function finishRestTimer(){
  clearInterval(restTimer.intervalId);
  restTimer.running = false;
  beep();
  if(navigator.vibrate) navigator.vibrate([250,100,250]);
  setTimeout(() => { restOverlay.classList.remove('show'); }, 900);
}
function stopRestTimer(){
  clearInterval(restTimer.intervalId);
  restTimer.running = false;
  restOverlay.classList.remove('show');
}
document.getElementById('restSkip').addEventListener('click', stopRestTimer);
document.getElementById('restAdd').addEventListener('click', () => {
  restTimer.remaining += 15; restTimer.total = Math.max(restTimer.total, restTimer.remaining);
  updateRestUI();
});
function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.start(); o.stop(ctx.currentTime + 0.5);
  }catch(e){}
}

let currentTab = 'treino';
function setTab(tab){
  currentTab = tab;
  document.querySelectorAll('nav.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tabpage').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  const eyebrows = { treino:'Hoje', historico:'Registro', medidas:'Evolução', config:'Ajustes' };
  const titles = { treino:'Diário de Treino', historico:'Histórico', medidas:'Medidas Corporais', config:'Configurações' };
  document.getElementById('hdrEyebrow').textContent = eyebrows[tab];
  document.getElementById('hdrTitle').textContent = titles[tab];
  render();
}
function refreshHeaderPill(){
  const pill = document.getElementById('hdrPill');
  if(currentTab === 'treino'){
    const p = getActivePlan();
    pill.textContent = p ? cleanTitle(p.title) : 'Sem treino';
  } else if(currentTab === 'medidas'){
    pill.textContent = state.measurements.length + (state.measurements.length===1 ? ' registro' : ' registros');
  } else if(currentTab === 'historico'){
    pill.textContent = state.logs.length + (state.logs.length===1 ? ' sessão' : ' sessões');
  } else {
    pill.textContent = '';
  }
}
document.querySelectorAll('nav.tabbar button').forEach(b => {
  b.addEventListener('click', () => setTab(b.dataset.tab));
});
function cleanTitle(t){ return (t||'').replace(/[🏋️]/g,'').replace(/#/g,'').trim(); }

/* ---------------------------------------------------------
   RENDER: TREINO
--------------------------------------------------------- */
function render(){
  if(currentTab === 'treino') renderTreino();
  if(currentTab === 'historico') renderHistorico();
  if(currentTab === 'medidas') renderMedidas();
  if(currentTab === 'config') renderConfig();
  refreshHeaderPill();
}

function renderTreino(){
  const el = document.getElementById('page-treino');
  const plan = getActivePlan();
  if(!plan){
    el.innerHTML = `
      <div class="empty">
        <div class="big">📄</div>
        <h3 class="display" style="font-size:17px;margin-bottom:6px;">Nenhum treino carregado</h3>
        <p style="font-size:13.5px;color:var(--text-dim);margin:0 0 18px;">Envie o arquivo .md com o seu plano de treino para começar a registrar.</p>
        <button class="btn primary" id="btnUploadEmpty">Enviar arquivo .md</button>
      </div>`;
    document.getElementById('btnUploadEmpty').addEventListener('click', () => document.getElementById('fileInput').click());
    return;
  }

  if(!state.selectedWorkoutTitle || !plan.workouts.some(w => w.title === state.selectedWorkoutTitle)){
    state.selectedWorkoutTitle = plan.workouts[0].title;
  }
  const workout = plan.workouts.find(w => w.title === state.selectedWorkoutTitle);
  if(!state.selectedDate) state.selectedDate = todayISO();

  let html = '';
  if(plan.notes && plan.notes.length){
    html += `<div class="notice">${plan.notes.map(n=>esc(n)).join('<br>')}</div>`;
  }

  html += `<div class="chiprow">`;
  plan.workouts.forEach(w => {
    const short = w.title.split('·')[0].trim();
    html += `<div class="chip ${w.title===workout.title?'active':''}" data-wk="${escAttr(w.title)}">${esc(short)}</div>`;
  });
  html += `</div>`;

  html += `<div class="row" style="margin-bottom:16px;">
    <div class="col field" style="margin-bottom:0;">
      <label>Data do treino</label>
      <input type="date" id="workoutDate" value="${state.selectedDate}" max="${todayISO()}">
    </div>
  </div>`;

  if(workout.notes && workout.notes.length){
    html += `<div class="notice">${workout.notes.map(n=>esc(n)).join('<br>')}</div>`;
  }

  const log = getDisplayLog(state.selectedDate, plan, workout);

  workout.sections.forEach(section => {
    html += `<div class="section-head"><h3>${esc(section.name)}</h3></div>`;
    section.exercises.forEach(ex => {
      const entry = log.exercises[ex.name];

      html += `<div class="exercise">
        <div class="exname">${esc(ex.name)}</div>
        ${ex.dica ? `<div class="exdica">${esc(ex.dica)}</div>` : ''}`;

      if(!ex.isDuration){
        const lastInfo = getLastSessionInfo(ex.name, state.selectedDate);
        if(lastInfo) html += `<div class="exlast">${esc(lastInfo)}</div>`;
      }

      if(ex.isDuration){
        html += `<div class="durationrow">
          <span class="dtext">⏱ ${esc(ex.repLabel)}</span>
          <div class="checkbtn ${entry.completedDuration?'done':''}" data-dur="${escAttr(ex.name)}">✓</div>
        </div>`;
      } else {
        entry.sets.forEach((s, idx) => {
          html += `<div class="setrow">
            <div class="setnum">${idx+1}</div>
            <input type="number" inputmode="decimal" step="0.5" placeholder="kg" value="${s.weight!==''&&s.weight!=null?s.weight:''}" data-ex="${escAttr(ex.name)}" data-set="${idx}" data-field="weight">
            <input type="text" placeholder="reps" value="${esc(s.reps!=null?s.reps:'')}" data-ex="${escAttr(ex.name)}" data-set="${idx}" data-field="reps">
            <div class="checkbtn ${s.completed?'done':''}" data-ex="${escAttr(ex.name)}" data-set="${idx}" data-action="toggle">✓</div>
          </div>`;
        });
      }
      html += `</div>`;
    });
  });

  html += `<div style="height:6px;"></div>`;

  el.innerHTML = html;
  saveState();

  // events
  el.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    state.selectedWorkoutTitle = c.dataset.wk;
    render();
  }));
  document.getElementById('workoutDate').addEventListener('change', (e) => {
    state.selectedDate = e.target.value;
    render();
  });
  el.querySelectorAll('input[data-ex]').forEach(inp => {
    inp.addEventListener('input', () => {
      const name = inp.dataset.ex, idx = parseInt(inp.dataset.set,10), field = inp.dataset.field;
      const l = getPersistedLog(state.selectedDate, plan, workout);
      l.exercises[name].sets[idx][field] = inp.value;
      saveState();
    });
  });
  el.querySelectorAll('[data-action="toggle"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.ex, idx = parseInt(btn.dataset.set,10);
      const l = getPersistedLog(state.selectedDate, plan, workout);
      const s = l.exercises[name].sets[idx];
      s.completed = !s.completed;
      saveState();
      btn.classList.toggle('done', s.completed);
      if(s.completed) startRestTimer();
    });
  });
  el.querySelectorAll('[data-dur]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.dur;
      const l = getPersistedLog(state.selectedDate, plan, workout);
      l.exercises[name].completedDuration = !l.exercises[name].completedDuration;
      saveState();
      btn.classList.toggle('done', l.exercises[name].completedDuration);
    });
  });
}

/* ---------------------------------------------------------
   RENDER: HISTÓRICO
--------------------------------------------------------- */
function renderHistorico(){
  const el = document.getElementById('page-historico');
  if(!state.logs.length){
    el.innerHTML = `<div class="empty"><div class="big">📜</div><h3 class="display" style="font-size:17px;margin-bottom:6px;">Nenhum treino registrado</h3><p style="font-size:13.5px;color:var(--text-dim);">Seus treinos concluídos vão aparecer aqui.</p></div>`;
    return;
  }
  const sorted = [...state.logs].sort((a,b) => b.date.localeCompare(a.date));
  let html = '';
  sorted.forEach(log => {
    const exNames = Object.keys(log.exercises);
    const totalSets = exNames.reduce((acc,n) => acc + (log.exercises[n].sets ? log.exercises[n].sets.length : 1), 0);
    const doneSets = exNames.reduce((acc,n) => {
      const e = log.exercises[n];
      if(e.sets) return acc + e.sets.filter(s=>s.completed).length;
      return acc + (e.completedDuration?1:0);
    }, 0);
    html += `<details class="logitem">
      <summary>
        <div>
          <div class="lidate">${fmtDateBR(log.date)}</div>
          <div class="liwk">${esc(log.workoutTitle)} · ${doneSets}/${totalSets} séries</div>
        </div>
        <div class="liarrow">›</div>
      </summary>
      <div class="lbody">`;
    exNames.forEach(name => {
      const e = log.exercises[name];
      html += `<div class="lex"><div class="lname">${esc(name)}</div><div class="lsets">`;
      if(e.sets){
        e.sets.forEach((s,i) => {
          html += `<span class="${s.completed?'done':''}">${i+1}ª: ${s.weight?esc(String(s.weight))+'kg':'-'} ${s.reps?'× '+esc(String(s.reps)):''}</span>`;
        });
      } else {
        html += `<span class="${e.completedDuration?'done':''}">${e.completedDuration?'concluído':'não concluído'}</span>`;
      }
      html += `</div></div>`;
    });
    html += `</div></details>`;
  });
  el.innerHTML = html;
}

/* ---------------------------------------------------------
   RENDER: MEDIDAS
--------------------------------------------------------- */
const BASE_FIELDS = [
  { key:'peso', label:'Peso', unit:'kg' },
  { key:'abdomen', label:'Abdômen', unit:'cm' },
  { key:'braco', label:'Braço', unit:'cm' },
  { key:'coxa', label:'Coxa', unit:'cm' },
];
function allFields(){ return [...BASE_FIELDS, ...state.settings.customFields]; }

function renderMedidas(){
  const el = document.getElementById('page-medidas');
  const fields = allFields();
  const sorted = [...state.measurements].sort((a,b) => a.date.localeCompare(b.date));
  const last = sorted[sorted.length-1];
  const prev = sorted[sorted.length-2];

  let daysHint = '';
  if(last){
    const diffDays = Math.floor((new Date(todayISO()) - new Date(last.date)) / 86400000);
    if(diffDays >= 7) daysHint = `<div class="notice warn">Já fazem ${diffDays} dias desde sua última medição. Que tal registrar hoje?</div>`;
    else if(diffDays > 0) daysHint = `<div class="notice">Última medição há ${diffDays} dia${diffDays>1?'s':''}.</div>`;
  }

  let html = daysHint;

  // stat cards com sparkline
  html += `<div class="statgrid">`;
  fields.forEach(f => {
    const pts = sorted.filter(m => m.values[f.key] != null && m.values[f.key] !== '').map(m => ({date:m.date, value: parseFloat(m.values[f.key])}));
    const curr = pts.length ? pts[pts.length-1].value : null;
    const previous = pts.length > 1 ? pts[pts.length-2].value : null;
    let deltaHtml = '';
    if(curr != null && previous != null){
      const d = +(curr - previous).toFixed(2);
      const cls = d < 0 ? 'down' : d > 0 ? 'up' : 'same';
      deltaHtml = `<span class="delta ${cls}">${d>0?'+':''}${d} ${f.unit}</span>`;
    }
    html += `<div class="statcard">
      <div class="slabel">${esc(f.label)}</div>
      <div class="sval">${curr != null ? curr + ' ' + f.unit : '—'} ${deltaHtml}</div>
      <canvas id="chart_${f.key}" width="300" height="44"></canvas>
    </div>`;
  });
  html += `</div>`;

  // form de nova medição
  html += `<div class="card">
    <div class="row" style="align-items:center; margin-bottom:12px;">
      <h3 class="display" style="font-size:14px;">Nova medição</h3>
      <div style="margin-left:auto;">
        <button class="iconbtn" id="btnAddField" title="Adicionar medida personalizada">+</button>
      </div>
    </div>
    <div class="field">
      <label>Data</label>
      <input type="date" id="mDate" value="${todayISO()}" max="${todayISO()}">
    </div>
    <div class="row wrap">`;
  fields.forEach(f => {
    html += `<div class="col field" style="min-width:130px;">
      <label>${esc(f.label)} (${f.unit})</label>
      <input type="number" inputmode="decimal" step="0.1" id="m_${f.key}" placeholder="${f.unit}">
    </div>`;
  });
  html += `</div>
    <button class="btn primary" id="btnSaveMeasure">Salvar medição</button>
  </div>`;

  // lista
  if(sorted.length){
    html += `<div class="card">`;
    [...sorted].reverse().forEach((m, idx, arr) => {
      const olderIdx = idx+1;
      const older = sorted[sorted.length-1-olderIdx];
      const parts = fields.filter(f => m.values[f.key]!=null && m.values[f.key]!=='').map(f => `${f.label}: ${m.values[f.key]}${f.unit}`);
      html += `<div class="mrow">
        <div>
          <div class="mdate">${fmtDateBR(m.date)}</div>
          <div class="mvals">${parts.join(' · ') || 'sem valores'}</div>
        </div>
        <div class="iconbtn" data-delmeasure="${m.id}" title="Excluir">✕</div>
      </div>`;
    });
    html += `</div>`;
  }

  el.innerHTML = html;

  // draw charts
  fields.forEach(f => {
    const canvas = document.getElementById('chart_' + f.key);
    const pts = sorted.filter(m => m.values[f.key] != null && m.values[f.key] !== '').map(m => parseFloat(m.values[f.key]));
    drawSparkline(canvas, pts);
  });

  document.getElementById('btnSaveMeasure').addEventListener('click', () => {
    const date = document.getElementById('mDate').value || todayISO();
    const values = {};
    let any = false;
    fields.forEach(f => {
      const v = document.getElementById('m_' + f.key).value;
      if(v !== ''){ values[f.key] = parseFloat(v); any = true; }
    });
    if(!any){ alert('Preencha ao menos uma medida.'); return; }
    const existingIdx = state.measurements.findIndex(m => m.date === date);
    if(existingIdx >= 0){
      if(!confirm('Já existe uma medição para essa data. Deseja substituir?')) return;
      state.measurements[existingIdx].values = { ...state.measurements[existingIdx].values, ...values };
    } else {
      state.measurements.push({ id: uid(), date, values });
    }
    saveState();
    render();
  });

  el.querySelectorAll('[data-delmeasure]').forEach(btn => {
    btn.addEventListener('click', () => {
      if(confirm('Excluir esta medição?')){
        state.measurements = state.measurements.filter(m => m.id !== btn.dataset.delmeasure);
        saveState();
        render();
      }
    });
  });

  const addFieldBtn = document.getElementById('btnAddField');
  if(addFieldBtn) addFieldBtn.addEventListener('click', () => {
    const label = prompt('Nome da nova medida (ex: Peitoral, Panturrilha):');
    if(!label) return;
    const unit = prompt('Unidade (ex: cm, kg):', 'cm') || 'cm';
    const key = 'custom_' + label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_');
    state.settings.customFields.push({ key, label, unit });
    saveState();
    render();
  });
}
function drawSparkline(canvas, values){
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 130, h = 44;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,w,h);
  if(values.length < 2){
    ctx.fillStyle = '#666c78'; ctx.font = '11px sans-serif';
    ctx.fillText(values.length ? 'apenas 1 registro' : 'sem dados', 0, h/2);
    return;
  }
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const pad = 6;
  ctx.beginPath();
  values.forEach((v,i) => {
    const x = pad + (i/(values.length-1)) * (w - pad*2);
    const y = h - pad - ((v - min)/range) * (h - pad*2);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = '#c8ff4d'; ctx.lineWidth = 2; ctx.lineJoin='round'; ctx.stroke();
  // last point dot
  const lastX = pad + (w - pad*2);
  const lastY = h - pad - ((values[values.length-1]-min)/range) * (h-pad*2);
  ctx.beginPath(); ctx.arc(lastX, lastY, 3, 0, Math.PI*2); ctx.fillStyle = '#c8ff4d'; ctx.fill();
}

/* ---------------------------------------------------------
   RENDER: CONFIG
--------------------------------------------------------- */
function renderConfig(){
  const el = document.getElementById('page-config');
  let html = `<div class="card">
    <h3 class="display" style="font-size:14px;margin-bottom:12px;">Descanso entre séries</h3>
    <div class="field">
      <label>Tempo global de descanso (segundos)</label>
      <input type="number" id="restSecondsInput" min="5" step="5" value="${state.settings.restSeconds}">
    </div>
    <div class="hint">O cronômetro inicia sozinho sempre que você marcar uma série como concluída.</div>
  </div>`;

  html += `<div class="card">
    <h3 class="display" style="font-size:14px;margin-bottom:12px;">Plano de treino</h3>
    <button class="btn primary" id="btnUploadNew">Enviar novo arquivo .md</button>
    <div class="hint">Ao enviar um novo arquivo, o treino atual é arquivado (fica salvo no histórico) e o novo passa a ser o ativo.</div>
  </div>`;

  if(state.plans.length){
    html += `<div class="card"><h3 class="display" style="font-size:14px;margin-bottom:6px;">Planos salvos</h3>`;
    [...state.plans].sort((a,b) => new Date(b.uploadedAt) - new Date(a.uploadedAt)).forEach(p => {
      const isActive = p.id === state.activePlanId;
      html += `<div class="planitem">
        <div>
          <div class="pname">${esc(cleanTitle(p.title))} ${isActive?'<span class=\"pill on\" style=\"margin-left:6px;\">ativo</span>':''}</div>
          <div class="pmeta">${new Date(p.uploadedAt).toLocaleDateString('pt-BR')} · ${p.workouts.length} treinos</div>
        </div>
        ${isActive ? '' : `<button class="btn ghost sm" data-activate="${p.id}">Ativar</button>`}
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="card">
    <h3 class="display" style="font-size:14px;margin-bottom:12px;">Backup dos dados</h3>
    <div class="row">
      <button class="btn ghost" id="btnExport">Exportar</button>
      <button class="btn ghost" id="btnImport">Importar</button>
    </div>
    <div class="hint">Os dados ficam salvos apenas neste navegador/aparelho. Exporte periodicamente para não perder seu histórico.</div>
  </div>`;

  html += `<div class="card">
    <h3 class="display" style="font-size:14px;margin-bottom:12px;color:var(--warn);">Zona de risco</h3>
    <button class="btn warn" id="btnResetAll">Apagar todos os dados</button>
  </div>`;

  el.innerHTML = html;

  document.getElementById('restSecondsInput').addEventListener('change', (e) => {
    const v = parseInt(e.target.value,10);
    state.settings.restSeconds = (v && v > 0) ? v : 60;
    saveState();
  });
  document.getElementById('btnUploadNew').addEventListener('click', () => document.getElementById('fileInput').click());
  el.querySelectorAll('[data-activate]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activePlanId = btn.dataset.activate;
      state.selectedWorkoutTitle = null;
      saveState();
      render();
    });
  });
  document.getElementById('btnExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'diario-treino-backup-' + todayISO() + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });
  document.getElementById('btnImport').addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json';
    inp.addEventListener('change', () => {
      const f = inp.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try{
          const imported = JSON.parse(e.target.result);
          if(!confirm('Isso vai substituir todos os dados atuais pelos do arquivo importado. Continuar?')) return;
          state = imported;
          if(!state.settings) state.settings = { restSeconds:60, customFields:[] };
          saveState();
          setTab('treino');
        }catch(err){ alert('Arquivo inválido.'); }
      };
      reader.readAsText(f);
    });
    inp.click();
  });
  document.getElementById('btnResetAll').addEventListener('click', () => {
    if(confirm('Isso vai apagar TODOS os treinos, medidas e histórico salvos neste aparelho. Tem certeza?')){
      if(confirm('Essa ação não pode ser desfeita. Confirmar exclusão total?')){
        localStorage.removeItem(STORE_KEY);
        state = loadState();
        setTab('treino');
      }
    }
  });
}

function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(str){ return esc(str).replace(/"/g,'&quot;'); }
